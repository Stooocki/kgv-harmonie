<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News-Archiv – KGV Harmonie e.V. Zwickau</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-deep:  #2A4A2E;
      --green-mid:   #3D6B42;
      --green-sage:  #7BA07F;
      --green-light: #C8DEC9;
      --cream:       #F5F0E8;
      --warm-white:  #FDFAF5;
      --amber:       #B8924A;
      --amber-light: #E8C97A;
      --charcoal:    #1E2820;
      --text-body:   #3A3A3A;
      --text-muted:  #6B7B6E;
      --border:      #D4E4D5;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Lato', sans-serif; font-weight: 300; background: var(--warm-white); color: var(--text-body); line-height: 1.75; }
    h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; color: var(--green-deep); line-height: 1.25; }
    a { color: var(--green-mid); text-decoration: none; }
    a:hover { color: var(--amber); }

    nav { position: sticky; top: 0; z-index: 100; background: var(--warm-white); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1100px; margin: 0 auto; padding: 0.75rem 2rem; }
    .nav-logo { display: flex; align-items: center; gap: 0.9rem; }
    .nav-logo img { width: 40px; height: 40px; border-radius: 50%; object-fit: contain; background: white; padding: 3px; border: 1px solid var(--border); }
    .nav-name { font-family: 'Playfair Display', serif; font-size: 0.95rem; color: var(--green-deep); }
    .nav-name span { display: block; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--green-sage); font-family: 'Lato', sans-serif; font-weight: 700; }
    .nav-back { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green-deep); transition: color 0.2s; }
    .nav-back:hover { color: var(--amber); }

    .page-header {
      min-height: 40vh;
      background: linear-gradient(160deg, rgba(20,32,22,0.65) 0%, rgba(42,74,46,0.50) 100%), url('hero.jpg') center/cover no-repeat;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 3rem 2rem;
    }
    .page-header h1 { color: white; font-size: clamp(2rem, 5vw, 3rem); text-shadow: 0 2px 20px rgba(0,0,0,0.6); font-style: italic; margin-bottom: 0.5rem; }
    .page-header p { color: rgba(255,255,255,0.85); font-size: 0.9rem; }

    .container { max-width: 820px; margin: 0 auto; padding: 0 2rem; }
    .section-label { display: inline-block; font-family: 'Lato', sans-serif; font-weight: 700; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--amber); margin-bottom: 1rem; }
    .divider { width: 48px; height: 3px; background: var(--amber); margin: 1rem 0 2rem; }

    .archiv-section { padding: 4rem 0; }
    .archiv-header { margin-bottom: 2.5rem; }

    .archiv-list { display: flex; flex-direction: column; gap: 1rem; }

    .archiv-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
      display: flex;
      gap: 1.2rem;
      transition: box-shadow 0.2s;
      overflow: hidden;
    }
    .archiv-card:hover { box-shadow: 0 4px 16px rgba(42,74,46,0.1); }

    .archiv-thumb {
      width: 80px; height: 80px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }
    .archiv-thumb:hover { transform: scale(1.05); }

    .archiv-placeholder {
      width: 80px; height: 80px;
      border-radius: 4px;
      background: var(--cream);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .archiv-content { flex: 1; min-width: 0; }

    .archiv-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.4rem;
    }

    .archiv-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--green-light);
      color: var(--green-deep);
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
    }

    .archiv-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .archiv-content h3 {
      font-size: 1rem;
      color: var(--green-deep);
      margin-bottom: 0.4rem;
    }

    .archiv-text {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .archiv-text.expanded {
      display: block;
      -webkit-line-clamp: unset;
      overflow: visible;
    }

    .archiv-toggle {
      background: none;
      border: none;
      color: var(--green-mid);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      margin-top: 0.4rem;
      letter-spacing: 0.04em;
    }
    .archiv-toggle:hover { color: var(--amber); }

    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }

    /* LIGHTBOX */
    .archiv-lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.92); align-items: center; justify-content: center; padding: 1rem; }
    .archiv-lightbox.open { display: flex; }
    .archiv-lightbox img { max-height: 85vh; max-width: 95vw; border-radius: 4px; object-fit: contain; }
    .archiv-lb-close { position: absolute; top: 1.5rem; right: 1.5rem; color: white; font-size: 2rem; cursor: pointer; background: none; border: none; opacity: 0.8; }

    footer { background: var(--charcoal); color: rgba(255,255,255,0.5); padding: 2rem; text-align: center; font-size: 0.78rem; margin-top: 2rem; }
    footer a { color: var(--green-sage); }

    @media (max-width: 480px) {
      .archiv-card { flex-direction: column; }
      .archiv-thumb, .archiv-placeholder { width: 100%; height: 160px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="nav-logo">
      <img src="logo.jpg" alt="KGV Harmonie Logo" />
      <div class="nav-name">Kleingartenanlage Harmonie e.V.<span>Werdauer Str. 136a · 08060 Zwickau</span></div>
    </div>
    <a href="index.html" class="nav-back">← Zurück zur Startseite</a>
  </div>
</nav>

<div class="page-header">
  <div>
    <h1>News-Archiv</h1>
    <p>Alle älteren Meldungen der Kleingartenanlage „Harmonie" e.V.</p>
  </div>
</div>

<section class="archiv-section">
  <div class="container">
    <div class="archiv-header">
      <span class="section-label">Archiv</span>
      <h2>Ältere Meldungen</h2>
      <div class="divider"></div>
    </div>
    <div class="archiv-list" id="archiv-list">
      <div class="loading">Archiv wird geladen …</div>
    </div>
  </div>
</section>

<div class="archiv-lightbox" id="archiv-lightbox">
  <button class="archiv-lb-close" onclick="closeLb()">✕</button>
  <img src="" id="archiv-lb-img" alt="News Bild" />
</div>

<footer>
  <a href="index.html">← Zurück zur Startseite</a><br /><br />
  © 2026 Kleingartenanlage „Harmonie" e.V. Zwickau
</footer>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSuxLH7jbqfmx6fOCAeHOYK3ZiwvNdf9Wa2YkAL9L7Ogos9n_EfStoux3laqVI3ZbSOozez26Aac-ms/pub?output=csv';

  function parseCSV(text) {
    text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const results = [];
    let headers = null;
    let i = 0;
    while (i < text.length) {
      const row = [];
      let field = '';
      let inQuotes = false;
      while (i < text.length) {
        const ch = text[i];
        if (inQuotes) {
          if (ch === '"') {
            if (text[i+1] === '"') { field += '"'; i += 2; }
            else { inQuotes = false; i++; }
          } else { field += ch === '\n' ? '<br>' : ch; i++; }
        } else {
          if (ch === '"') { inQuotes = true; i++; }
          else if (ch === ',') { row.push(field.trim()); field = ''; i++; }
          else if (ch === '\n') { row.push(field.trim()); field = ''; i++; break; }
          else { field += ch; i++; }
        }
      }
      if (field.length > 0) row.push(field.trim());
      if (row.length > 0) {
        if (headers === null) { headers = row; }
        else {
          const obj = {};
          headers.forEach((h, idx) => obj[h] = (row[idx] || '').trim());
          if (obj.Titel && obj.Titel.length > 0) results.push(obj);
        }
      }
    }
    return results;
  }

  function openLb(src) {
    document.getElementById('archiv-lb-img').src = src;
    document.getElementById('archiv-lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLb() {
    document.getElementById('archiv-lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('archiv-lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('archiv-lightbox')) closeLb();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

  function toggleArchivText(id, btn) {
    const p = document.getElementById(id);
    if (p.classList.contains('expanded')) {
      p.classList.remove('expanded');
      btn.textContent = '▼ Mehr lesen';
    } else {
      p.classList.add('expanded');
      btn.textContent = '▲ Weniger anzeigen';
    }
  }

  fetch(CSV_URL)
    .then(r => r.text())
    .then(text => {
      const items = parseCSV(text).reverse().filter(i => i.Archiv && i.Archiv.toLowerCase() === 'ja');
      const list = document.getElementById('archiv-list');

      if (!items.length) {
        list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem 0;">Noch keine archivierten Meldungen vorhanden.</p>';
        return;
      }

      list.innerHTML = items.map((item, idx) => {
        const isLong = item.Inhalt && item.Inhalt.length > 120;
        const textId = `archiv-text-${idx}`;
        const thumb = item.Bild && item.Bild.trim()
          ? `<img src="${item.Bild.trim()}" class="archiv-thumb" onclick="openLb('${item.Bild.trim()}')" alt="News Bild" />`
          : `<div class="archiv-placeholder">📰</div>`;

        return `
          <div class="archiv-card">
            ${thumb}
            <div class="archiv-content">
              <div class="archiv-meta">
                <span class="archiv-tag">${item.Kategorie || 'Vereinsnews'}</span>
                <span class="archiv-date">📅 ${item.Datum}</span>
              </div>
              <h3>${item.Titel}</h3>
              <p id="${textId}" class="archiv-text">${item.Inhalt}</p>
              ${isLong ? `<button class="archiv-toggle" onclick="toggleArchivText('${textId}', this)">▼ Mehr lesen</button>` : ''}
            </div>
          </div>`;
      }).join('');
    })
    .catch(() => {
      document.getElementById('archiv-list').innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:2rem 0;">Archiv konnte nicht geladen werden.</p>';
    });
</script>

</body>
</html>
